[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quantum-link-optimizer"
version = "0.1.0"
description = "Offline forecasting of two synthetic classical RTT channels"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.1,<3", "torch>=2.6,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
quantum-link = "quantum_link_optimizer.cli:main"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_link_optimizer"]
